<header class="site-header">
  <div class="bar">
    <a class="logo" href="index.html">Nittin S</a>
    <button class="icon-btn menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav" aria-label="Open menu">☰</button>
    <nav id="nav" class="nav" aria-label="Main">
      <a href="index.html">Home</a>

  </div>
</header>

<main id="main">
  <section class="wrap section">
    <h1 class="page-title">Contact</h1>
    <p>Email me at <a href="mailto:nittin.demo@example.com">nittin.demo@example.com</a> (demo address), or try the form below. The form only checks your entries on this page. It does not send a message.</p>
    <form id="form" novalidate>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>
      <p class="err" id="nameErr" role="alert"></p>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <p class="err" id="emailErr" role="alert"></p>
      <label for="msg">Message</label>
      <textarea id="msg" name="msg" rows="4" required></textarea>
      <p class="err" id="msgErr" role="alert"></p>
      <button class="btn" type="submit">Check my message</button>
      <p class="ok" id="ok" role="status"></p>
    </form>
  </section>
</main>

<footer class="site-footer">
  <!-- CHANGE THIS EMAIL: replace nittin.demo@example.com in the footer and on the Contact page. -->
  <p>© <span id="year">2026</span> Nittin S · <a href="mailto:nittin.demo@example.com">nittin.demo@example.com</a></p>
